name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** use this form for security
        vulnerabilities — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `dabuj doctor`
      description: This tells us about your Python, FFmpeg, hardware and models.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        From `<data-dir>/logs/dabuj.jsonl`. Re-run with `--debug` for more
        detail. Logs never contain transcript text, so they are safe to share.
      render: text

  - type: input
    id: version
    attributes:
      label: Dabuj version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Media details, if relevant
      description: >
        Container, codec and duration — from `dabuj probe <file>`. Please do not
        attach the media itself.
