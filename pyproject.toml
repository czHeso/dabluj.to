[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dabuj"
version = "0.1.0"
description = "Local-first AI transcription, translation and dubbing studio"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "czHeso" }]
keywords = ["transcription", "dubbing", "translation", "whisper", "tts", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core dependencies are deliberately small and pure-Python. Everything that
# pulls in a heavy ML runtime lives behind an optional extra so that
# `pip install dabuj` stays fast and works on any machine.
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<0.20",
    "rich>=13.7",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "psutil>=5.9",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    # Verify HTTPS against the OS trust store, so Dabuj works behind the
    # TLS-inspecting proxies common on corporate machines. See dabuj/net.py.
    "truststore>=0.9",
]

[project.optional-dependencies]
# Local speech recognition (CTranslate2 backend).
asr = ["faster-whisper>=1.0.3"]

# Local web application: FastAPI backend + browser UI.
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psutil",
]

# Everything needed to actually run the full local application.
all = ["dabuj[asr,api]"]

[project.scripts]
dabuj = "dabuj.cli.main:run"

[project.urls]
Homepage = "https://github.com/czHeso/dabluj.to"
Documentation = "https://github.com/czHeso/dabluj.to/tree/main/docs"
Issues = "https://github.com/czHeso/dabluj.to/issues"
Changelog = "https://github.com/czHeso/dabluj.to/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/dabuj"]

[tool.hatch.build.targets.sdist]
include = ["backend/src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend/src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "PTH",  # prefer pathlib
    "RET",  # return conventions
    "ARG",  # unused arguments
    "S",    # bandit-style security checks
    "TID",  # tidy imports
]
ignore = [
    "S101",  # assert: used intentionally in tests and internal invariants
    "S603",  # subprocess call: we always pass argument arrays, never shell=True
    "S607",  # partial executable path: ffmpeg is resolved via PATH by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S", "B008"]
# Typer's API is built on function-call defaults.
"backend/src/dabuj/cli/**" = ["B008", "ARG001", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["dabuj"]

[tool.mypy]
python_version = "3.10"
mypy_path = "backend/src"
packages = ["dabuj"]
strict = true
warn_unreachable = true
# Third-party modules that ship no type information, plus optional heavy
# dependencies that are deliberately absent from the lint environment. Dabuj
# imports all of these defensively (inside try/except), so an unresolved import
# here is expected rather than a defect.
[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "ctranslate2.*",
    "onnxruntime.*",
    "torch.*",
    "truststore.*",
    "tomli.*",
    "tomli_w.*",
    "psutil.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: fast, hermetic tests with no external binaries or models (default)",
    "integration: requires FFmpeg or touches the real filesystem/network stack",
    "ml: downloads or runs a real AI model -- never run in normal CI",
    "gpu: requires a GPU to be present",
    "slow: takes more than a few seconds",
]
